[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-portcheck"
version = "0.1.0"
description = "Check which parts of GitHub Actions workflows will not work on Forgejo or Gitea Actions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["github-actions", "forgejo", "gitea", "ci", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/N-Combinator/gha-portcheck"
Issues = "https://github.com/N-Combinator/gha-portcheck/issues"

[project.scripts]
gha-portcheck = "gha_portcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gha_portcheck = ["rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
